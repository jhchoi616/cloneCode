<!DOCTYPE html>

<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>소식 관리 — B.POINT Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
      href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Archivo+Black&display=swap"
      rel="stylesheet">

  <link rel="stylesheet" href="/css/admin-styles.css" />
</head>

<body>

<div th:replace="~{layout/admin/sidebar :: sidebar}"></div>

<main class="app">

  <!-- ======================================================= -->

  <!-- 상단 -->

  <!-- ======================================================= -->

  <div class="topbar">

<div>

  <h1>소식 관리</h1>

  <div class="crumbs">
    관리자 / 소식 관리
  </div>

</div>


<div class="right">

  <!-- 새 글 작성 -->
  <button
      type="button"
      class="btn btn-primary"
      onclick="openModal()">

    + 새 글 작성

  </button>

</div>

  </div>

  <!-- ======================================================= -->

  <!-- 콘텐츠 -->

  <!-- ======================================================= -->

  <div class="content">

<div class="panel">


  <!-- 패널 헤더 -->
  <div class="panel-head">

    <h2>

      전체 소식

      <span
          style="color:var(--muted);font-weight:600;margin-left:4px"
          th:text="'(' + ${#lists.size(newsList)} + '건)'">

      </span>

    </h2>


    <div class="actions">


      <!-- 카테고리 필터 -->
      <select
          id="filter"
          class="btn btn-line btn-sm"
          style="padding-right:24px">

        <option value="all">
          전체 카테고리
        </option>

        <option value="class">
          CLASS
        </option>

        <option value="event">
          EVENT
        </option>

        <option value="story">
          STORY
        </option>

      </select>


      <!-- 제목 검색 -->
      <input
          type="text"
          id="search"
          class="btn btn-line btn-sm"
          placeholder="제목 검색"
          style="font-weight:500;min-width:200px" />

    </div>

  </div>


  <!-- ===================================================== -->
  <!-- 테이블 -->
  <!-- ===================================================== -->

  <div class="panel-body">

    <table
        class="dt"
        id="tbl">


      <thead>

      <tr>

        <th style="width:90px">
          카테고리
        </th>

        <th>
          제목
        </th>

        <th style="width:120px">
          날짜
        </th>

        <th style="width:120px">
          작성자
        </th>

        <th style="width:200px">
        </th>

      </tr>

      </thead>


      <tbody>


      <!-- 등록된 소식이 없는 경우 -->
      <tr th:if="${#lists.isEmpty(newsList)}">

        <td colspan="5">

          <div class="empty">

            <div class="ico">
              ▦
            </div>

            <p>
              등록된 소식이 없습니다.
            </p>

            <button
                type="button"
                class="btn btn-primary btn-sm"
                onclick="openModal()">

              + 새 글 작성

            </button>

          </div>

        </td>

      </tr>


      <!-- ================================================= -->
      <!-- 소식 목록 -->
      <!-- ================================================= -->

      <tr
          th:each="news : ${newsList}"

          th:attr="
            data-category=${
                news.category == 1
                ? 'class'
                : news.category == 2
                ? 'event'
                : 'story'
            },

            data-title=${news.title}
          ">


        <!-- 카테고리 -->
        <td>


          <span
              class="badge-tag"

              th:text="${
                news.category == 1
                ? 'CLASS'
                : news.category == 2
                ? 'EVENT'
                : 'STORY'
              }">

          </span>


          <!-- EVENT 사례 표시 -->
          <span
              th:if="${news.isView}"
              class="badge-tag new"
              style="
                margin-left:4px;
                font-size:9px">

            사례

          </span>


        </td>


        <!-- 제목 -->
        <td>


          <div
              style="
                font-weight:600;
                margin-bottom:4px"
              th:text="${news.title}">

          </div>


          <div
              style="
                font-size:12px;
                color:var(--muted);
                max-width:560px;
                white-space:nowrap;
                overflow:hidden;
                text-overflow:ellipsis"
              th:text="${news.excerpt}">

          </div>


        </td>


        <!-- 날짜 -->
        <td
            style="color:var(--muted)"
            th:text="${news.startDate}">

        </td>


        <!-- 작성자 -->
        <td
            style="color:var(--soft)"
            th:text="${
              news.createdBy != null
              ? news.createdBy
              : 'B.POINT'
            }">

        </td>


        <!-- 버튼 -->
        <td class="actions">


          <!-- 수정 -->
          <button
              type="button"
              class="btn btn-line btn-sm"

              th:attr="
                onclick=|editItem(${news.id})|
              ">

            수정

          </button>


          <!-- 삭제 -->
          <button
              type="button"
              class="btn btn-danger btn-sm"

              th:attr="
                onclick=|deleteItem(${news.id})|
              ">

            삭제

          </button>


        </td>

      </tr>

      </tbody>

    </table>

  </div>

</div>

  </div>

</main>

<!-- ========================================================= -->

<!-- 소식 작성 / 수정 모달 -->

<!-- ========================================================= -->

<div
    class="modal-back"
    id="modal">

  <div
      class="modal"
      style="max-width:680px">

<!-- ===================================================== -->
<!-- 모달 헤더 -->
<!-- ===================================================== -->

<div class="modal-head">


  <h3 id="mTitle">
    새 소식 작성
  </h3>


  <button
      type="button"
      class="close"
      onclick="closeModal()">

    ✕

  </button>


</div>



<!-- ===================================================== -->
<!-- 모달 내용 -->
<!-- ===================================================== -->

<div class="modal-body">


  <form id="form">


    <!-- 수정할 News ID -->
    <input
        type="hidden"
        id="f-id" />


    <!-- ================================================= -->
    <!-- 카테고리 / 날짜 -->
    <!-- ================================================= -->

    <div class="fld-row">


      <div class="fld">

        <label>
          카테고리 *
        </label>


        <select
            id="f-category"
            required>

          <option value="class">
            CLASS
          </option>

          <option value="event">
            EVENT
          </option>

          <option value="story">
            STORY
          </option>

        </select>

      </div>



      <div class="fld">

        <label>
          날짜
        </label>


        <input
            type="date"
            id="f-date" />

      </div>


    </div>



    <!-- ================================================= -->
    <!-- 제목 -->
    <!-- ================================================= -->

    <div class="fld">

      <label>
        제목 *
      </label>


      <input
          type="text"
          id="f-title"
          required
          placeholder="제목을 입력하세요" />

    </div>



    <!-- ================================================= -->
    <!-- 요약 -->
    <!-- ================================================= -->

    <div class="fld">

      <label>
        요약
      </label>


      <textarea
          id="f-excerpt"
          style="min-height:60px"
          placeholder="짧은 요약문 (1~2문장)"></textarea>

    </div>



    <!-- ================================================= -->
    <!-- 본문 -->
    <!-- ================================================= -->

    <div class="fld">

      <label>
        본문 *
      </label>


      <textarea
          id="f-content"
          required
          style="min-height:180px"
          placeholder="기사 본문"></textarea>

    </div>



    <!-- ================================================= -->
    <!-- 작성자 / 이미지 -->
    <!-- ================================================= -->

    <div class="fld-row">


      <div class="fld">

        <label>
          작성자
        </label>


        <input
            type="text"
            id="f-author"
            placeholder="B.POINT" />

      </div>



      <div class="fld">

        <label>
          대표 이미지 URL
        </label>


        <input
            type="text"
            id="f-image"
            placeholder="https://... 또는 assets/..." />

      </div>


    </div>



    <!-- ================================================= -->
    <!-- EVENT 전용 -->
    <!-- ================================================= -->

    <div
        class="fld"
        id="event-option"
        style="
          display:none;
          background:#FFF6F2;
          border:1px solid var(--orange);
          border-radius:8px;
          padding:14px 16px">


      <label
          style="
            display:flex;
            align-items:center;
            gap:10px;
            cursor:pointer;
            margin:0;
            color:var(--ink)">


        <input
            type="checkbox"
            id="f-show-in-event"
            style="
              width:auto;
              margin:0;
              cursor:pointer" />


        <span
            style="
              text-transform:none;
              letter-spacing:0;
              font-size:14px;
              color:var(--ink)">

          이벤트 상세 페이지 '사례' 항목에 표시

        </span>


      </label>


      <p
          style="
            font-size:12px;
            color:var(--soft);
            margin:8px 0 0 26px;
            line-height:1.5">

        체크하면 사용자 화면의
        <strong>이벤트 페이지 → 함께한 사례들</strong>
        영역에 노출됩니다.

      </p>


    </div>


  </form>

</div>



<!-- ===================================================== -->
<!-- 모달 하단 -->
<!-- ===================================================== -->

<div class="modal-foot">


  <!-- 수정 모드에서만 나타나는 삭제 버튼 -->
  <button
      type="button"
      class="btn btn-danger btn-sm"
      id="delBtn"
      onclick="removeItem()"
      style="
        margin-right:auto;
        display:none">

    삭제

  </button>



  <button
      type="button"
      class="btn btn-line"
      onclick="closeModal()">

    취소

  </button>



  <button
      type="button"
      class="btn btn-primary"
      onclick="save()">

    저장

  </button>


</div>

  </div>

</div>

<script src="/js/admin-common.js"></script>

<script>
  const numberToCategory = {

    1: 'class',

    2: 'event',

    3: 'story'

  };
      const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;

    const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
  /*
   * ============================================================
   * 공통
   * ============================================================
   */




  /*
   * ============================================================
   * 카테고리 변환
   *
   * DB
   * 1 = CLASS
   * 2 = EVENT
   * 3 = STORY
   *
   * 화면
   * class / event / story
   * ============================================================
   */

  const categoryToNumber = {

    class: 1,

    event: 2,

    story: 3

  };






  /*
   * ============================================================
   * 모달 열기
   *
   * item이 없으면 신규 작성
   * item이 있으면 수정
   * ============================================================
   */

  function openModal(item = null) {

    /*
     * 제목
     */
    document.getElementById('mTitle').textContent =
        item
        ? '소식 수정'
        : '새 소식 작성';

    /*
     * ID
     *
     * 신규:
     * ''
     *
     * 수정:
     * News ID
     */
    document.getElementById('f-id').value =
        item?.id ?? '';

    /*
     * 카테고리
     *
     * News.category는 Integer이므로
     * 화면의 class/event/story로 변환
     */
    document.getElementById('f-category').value =
        item ? numberToCategory[item.category] ?? 'class' : 'class';

    /*
     * 시작일
     */
    document.getElementById('f-date').value =
        item?.startDate
        ?? new Date().toISOString().slice(0, 10);

    /*
     * 제목
     */
    document.getElementById('f-title').value =
        item?.title ?? '';

    /*
     * 요약
     */

    document.getElementById('f-excerpt').value =
        item?.excerpt ?? '';

    /*
     * 본문
     */
    document.getElementById('f-content').value =
        item?.content ?? '';

    /*
     * 작성자
     */
    document.getElementById('f-author').value =
        item?.createdBy
        ?? 'B.POINT';

    /*
     * 이미지
     *
     * News Entity:
     * private String ImageUrl;
     *
     * Lombok getter 기준 JSON 이름은 imageUrl
     */

    document.getElementById('f-image').value =
        item?.imageUrl ?? '';



    /*
     * EVENT 사례 여부
     */

    document.getElementById('f-show-in-event').checked =
        item?.isView === true;



    /*
     * EVENT 옵션 표시 여부
     */

    toggleEventOption();



    /*
     * 삭제 버튼
     *
     * 신규 작성:
     * 숨김
     *
     * 수정:
     * 표시
     */

    document.getElementById('delBtn').style.display =
        item
        ? 'inline-flex'
        : 'none';



    /*
     * 모달 열기
     */

    document
        .getElementById('modal')
        .classList
        .add('open');

  }



  /*
   * ============================================================
   * 모달 닫기
   * ============================================================
   */

  function closeModal() {

    document
        .getElementById('modal')
        .classList
        .remove('open');

  }



  /*
   * ============================================================
   * EVENT 옵션
   * ============================================================
   */

  function toggleEventOption() {

    const category =
        document.getElementById('f-category').value;


    document.getElementById('event-option').style.display =
        category === 'event'
        ? 'block'
        : 'none';

  }



  /*
   * 카테고리 변경 감지
   */

  document
      .getElementById('f-category')
      .addEventListener(
          'change',
          toggleEventOption
      );



  /*
   * ============================================================
   * 수정
   *
   * 수정 버튼
   * ↓
   * GET /admin/news/{id}
   * ↓
   * News JSON
   * ↓
   * openModal(item)
   * ============================================================
   */

  async function editItem(id) {

    try {


      console.log(
          '뉴스 조회:',
          id
      );


      const response =
          await fetch(
              '/admin/news/' + id,
              {
                method: 'GET',
                headers: {
                  'Accept': 'application/json'
                }
              }
          );



      /*
       * 서버 오류
       */

      if (!response.ok) {

        console.error(
            '뉴스 조회 실패:',
            response.status
        );

        throw new Error(
            '소식 정보를 가져오지 못했습니다.'
        );

      }



      /*
       * JSON 변환
       */

      const item =
          await response.json();



      console.log(
          '가져온 뉴스:',
          item
      );



      /*
       * 모달에 데이터 입력
       */

      openModal(item);


    } catch (error) {

      console.error(
          'editItem 오류:',
          error
      );


      alert(
          error.message
      );

    }

  }



  /*
   * ============================================================
   * 저장
   *
   * 신규:
   * POST /admin/news
   *
   * 수정:
   * PUT /admin/news/{id}
   * ============================================================
   */

  async function save() {


    /*
     * 수정 여부 확인
     */

    const id =
        document
            .getElementById('f-id')
            .value;



    /*
     * 화면 category
     *
     * class/event/story
     *
     * 를 DB용
     *
     * 1/2/3
     *
     * 으로 변환
     */

    const categoryText =
        document
            .getElementById('f-category')
            .value;


    const category =
        categoryToNumber[categoryText];



    /*
     * 데이터 생성
     *
     * News Entity 필드명과 일치
     */

    const data = {


      category:
          category,


      title:
          document
              .getElementById('f-title')
              .value
              .trim(),


      excerpt:
          document
              .getElementById('f-excerpt')
              .value
              .trim(),


      content:
          document
              .getElementById('f-content')
              .value
              .trim(),


      imageUrl:
          document
              .getElementById('f-image')
              .value
              .trim()
          || null,


      startDate:
          document
              .getElementById('f-date')
              .value
          || new Date()
              .toISOString()
              .slice(0, 10),


      isView:
          categoryText === 'event'
          &&
          document
              .getElementById('f-show-in-event')
              .checked,


      createdBy:
          document
              .getElementById('f-author')
              .value
              .trim()
          || 'B.POINT'

    };



    /*
     * 필수값 검사
     */

    if (!data.title) {

      alert(
          '제목을 입력해주세요.'
      );

      return;

    }


    if (!data.content) {

      alert(
          '본문을 입력해주세요.'
      );

      return;

    }



    /*
     * ==========================================================
     * 서버 전송
     * ==========================================================
     */

    try {
      let response;

      /*
       * 신규 등록
       */
      if (!id) {
        console.log(
            '뉴스 신규 등록:',
            data
        );
        response = await fetch(
                '/admin/news',
                {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  [csrfHeader]: csrfToken
                  },
                  body:
                      JSON.stringify(data)
                }
            );

      }

      /*
       * 수정
       */
      else {
        console.log(
            '뉴스 수정:',
            id,
            data
        );
        response =
            await fetch(
                '/admin/news/' + id,
                {

                  method: 'PUT',

                  headers: {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                  [csrfHeader]: csrfToken

                  },

                  body:
                      JSON.stringify(data)

                }
            );

      }



      /*
       * 응답 확인
       */

      if (!response.ok) {

        console.error(
            '저장 실패:',
            response.status
        );


        throw new Error(
            '저장에 실패했습니다.'
        );

      }

      /*
       * 모달 닫기
       */

      closeModal();

      /*
       * 목록 새로고침
       */
      location.reload();

    } catch (error) {

      console.error(
          'save 오류:',
          error
      );
      alert(
          error.message
      );

    }

  }



  /*
   * ============================================================
   * 목록에서 삭제
   *
   * DELETE /admin/news/{id}
   * ============================================================
   */

  async function deleteItem(id) {
    if (
        !confirm(
            '이 소식을 삭제할까요?'
        )
    ) {

      return;

    }
    try {


      const response =
          await fetch(
              '/admin/news/' + id,
              {
                method: 'DELETE',
                headers:{
                  [csrfHeader]: csrfToken
                }
              }
          );

      if (!response.ok) {
        throw new Error(
            '삭제에 실패했습니다.'
        );

      }



      /*
       * 삭제 성공
       */

      location.reload();


    } catch (error) {

      console.error(
          'deleteItem 오류:',
          error
      );


      alert(
          error.message
      );

    }

  }



  /*
   * ============================================================
   * 모달에서 삭제
   * ============================================================
   */

  async function removeItem() {
    const id =
        document
            .getElementById('f-id')
            .value;

    /*
     * 신규 작성 모달에서는
     * 삭제할 ID가 없음
     */
    if (!id) {

      return;

    }



    await deleteItem(id);

  }



  /*
   * ============================================================
   * 카테고리 필터
   * ============================================================
   */

  document
      .getElementById('filter')
      .addEventListener(
          'change',
          function () {


            const value =
                this.value;



            document
                .querySelectorAll(
                    '#tbl tbody tr[data-category]'
                )
                .forEach(
                    row => {


                      const category =
                          row.dataset.category;



                      const visible =
                          value === 'all'
                          ||
                          category === value;



                      row.style.display =
                          visible
                          ? ''
                          : 'none';

                    }
                );

          }
      );



  /*
   * ============================================================
   * 제목 검색
   * ============================================================
   */

  document
      .getElementById('search')
      .addEventListener(
          'input',
          function () {


            const keyword =
                this.value
                    .toLowerCase()
                    .trim();



            document
                .querySelectorAll(
                    '#tbl tbody tr[data-title]'
                )
                .forEach(
                    row => {


                      const title =
                          (
                            row.dataset.title
                            || ''
                          )
                          .toLowerCase();



                      row.style.display =
                          title.includes(keyword)
                          ? ''
                          : 'none';

                    }
                );

          }
      );



  /*
   * ============================================================
   * 모달 바깥 클릭
   * ============================================================
   */

  document
      .getElementById('modal')
      .addEventListener(
          'click',
          function (e) {


            if (
                e.target.id === 'modal'
            ) {

              closeModal();

            }

          }
      );

</script>

</body>
</html>
