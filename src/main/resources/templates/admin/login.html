<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>로그인 — B.POINT Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Archivo+Black&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/admin-styles.css}" />
</head>

<body>

<div class="login-wrap">

  <div class="login-card">

    <div class="top">
      <img
        th:src="@{/assets/헤더 로고.png}"
        alt="B.POINT">
    </div>

    <h2>관리자 로그인</h2>

    <p class="sub">
      B.POINT 관리자 페이지에 접근하려면 비밀번호를 입력하세요.
    </p>

    <!-- 로그인 실패 시 표시 -->
    <div
      class="err"
      th:if="${param.error}">
      비밀번호가 올바르지 않습니다.
    </div>

    <form
      th:action="@{/admin/login}"
      method="post">
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">
      <div class="fld">

        <label for="userId" >관리자 ID</label>

        <input
          type="text"
          id="userId"
          name="userId"
          required
          value="admin"
          readonly
           />

      </div>

      <div class="fld">

        <label for="passwd">관리자 비밀번호</label>

        <input
          type="password"
          id="passwd"
          name="passwd"
          required
          autofocus
          placeholder="••••••••" />

      </div>

      <button
        class="btn btn-primary"
        type="submit">
        로그인 →
      </button>

    </form>
    <div class="login-hint">
      비밀번호: <code>bpoint2026</code>
    </div>
  </div>

</div>

</body>
</html>
