<!DOCTYPE html>

<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>문의 관리 — B.POINT Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Archivo+Black&display=swap"
        rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/admin-styles.css}">
</head>

<body>

<!-- 사이드바 -->

  <div th:replace="~{layout/admin/sidebar :: sidebar}"></div>


<main class="app">

  <!-- 상단 -->

  <div class="topbar">

<div>
  <h1>문의 관리</h1>
  <div class="crumbs">관리자 / 문의 관리</div>
</div>

<div class="right">
  <span style="font-size:13px;color:var(--soft)">
    총 <span th:text="${#lists.size(inquiries)}">0</span>건
  </span>
</div>

  </div>

  <div class="content">

<div class="panel">

  <!-- 패널 헤더 -->
  <div class="panel-head">

    <h2>
      접수된 문의
      <span style="color:var(--muted);font-weight:600;margin-left:4px"
            th:text="'(' + ${#lists.size(inquiries)} + '건)'">
        (0건)
      </span>
    </h2>

    <!-- 유형 필터 -->
    <div class="actions">

      <form method="get"
            th:action="@{/admin/inquiries}">

        <select name="type"
                class="btn btn-line btn-sm"
                style="padding-right:24px"
                onchange="this.form.submit()">

          <option value="all"
                  th:selected="${type == null or type == 'all'}">
            전체 유형
          </option>

          <option value="1"
                  th:selected="${type == '협력'}">
            협력
          </option>

          <option value="2"
                  th:selected="${type == '단체 수업 요청'}">
            단체 수업 요청
          </option>

          <option value="3"
                  th:selected="${type == '질문'}">
            질문
          </option>

          <option value="4"
                  th:selected="${type == '기타'}">
            기타
          </option>

        </select>

      </form>

    </div>

  </div>


  <!-- 문의 목록 -->
  <div class="panel-body">

    <table class="dt" id="tbl">

      <thead>
      <tr>
        <th style="width:140px">유형</th>
        <th style="width:120px">이름</th>
        <th>문의 내용</th>
        <th style="width:160px">접수일</th>
        <th style="width:140px"></th>
      </tr>
      </thead>


      <tbody>

      <!-- 문의가 없는 경우 -->
      <tr th:if="${#lists.isEmpty(inquiries)}">

        <td colspan="5">

          <div class="empty">

            <div class="ico">✉</div>

            <p>접수된 문의가 없습니다.</p>

          </div>

        </td>

      </tr>


      <!-- 문의 목록 -->
      <tr th:each="inquiry : ${inquiries}"
                        th:onclick="|openDetail(${inquiry.id})|"
                        style="cursor:pointer">

        <!-- 유형 -->
        <td>

          <span style="font-weight:700;color:var(--ink)"
                th:text="${inquiry.type == 1 ? '협력' : inquiry.type == 2 ? '단체 수업 요청' : inquiry.type == 3 ? '질문' : '기타' }">
            문의 유형
          </span>

        </td>


        <!-- 이름 -->
        <td style="font-weight:700"
            th:text="${inquiry.createdBy}">
          이름
        </td>


        <!-- 문의 내용 -->
        <td style="
            color:var(--soft);
            max-width:420px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;"
            th:text="${#strings.abbreviate(inquiry.message, 100)}">
          문의 내용
        </td>


        <!-- 접수일 -->
        <td style="color:var(--muted)"
            th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}">
          2026-01-01 12:00
        </td>


        <!-- 보기 -->
        <td class="actions">

          <button type="button"
        class="btn btn-line btn-sm"
        th:onclick="|event.stopPropagation(); openDetail(${inquiry.id})|">
  보기
</button>

        </td>

      </tr>

      </tbody>

    </table>

  </div>

</div>

  </div>

</main>

<!-- 문의 상세 모달 -->


<!-- 문의 상세 모달 -->
<div class="modal-back"
     id="modal">

  <div class="modal"
       style="max-width:680px">

    <div class="modal-head">

      <h3>문의 상세</h3>

      <button type="button"
              class="close"
              onclick="closeModal()">
        ✕
      </button>

    </div>


    <div class="modal-body">

      <div class="kv" id="kv">

    
        <div class="k">작성자</div>
        <div class="v" id="detailName"></div>
    


        <div class="k">연락처</div>
        <div class="v" id="detailContact"></div>


        <div class="k">문의 유형</div>
        <div class="v">
          <span class="badge-tag pending" id="detailType"></span>
        </div>
  

    
        <div class="k">작성일</div>
        <div class="v" id="detailCreatedAt"></div>
    

</div>


      <!-- 문의 내용 -->
      <div class="message-box"
           id="msgBox">

        <!-- JavaScript로 내용 출력 -->

      </div>

    </div>


    <div class="modal-foot">

      <!-- 삭제 -->
      <form id="deleteForm"
            method="post"
            style="margin-right:auto"
            onsubmit="return confirm('이 문의를 삭제할까요?');">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <button type="submit"
                class="btn btn-danger btn-sm">
          삭제
        </button>

      </form>


      <button type="button"
              class="btn btn-line"
              onclick="closeModal()">
        닫기
      </button>

    </div>

  </div>

</div>
<script>

    // 문의 상세 조회
    async function openDetail(id) {

        try {

            const response =
                await fetch(`/admin/inquiries/api/${id}`);

            if (!response.ok) {
                throw new Error('문의 상세 조회 실패');
            }

            const inquiry = await response.json();


            // 상세 정보 출력
            document.getElementById('detailName').textContent =
                inquiry.createdBy || '';

            document.getElementById('detailContact').textContent =
                inquiry.contact || '';

            document.getElementById('detailType').textContent =
                getInquiryType(inquiry.type) || '';

            document.getElementById('detailCreatedAt').textContent =
                formatDateTime(inquiry.createdAt);

            document.getElementById('msgBox').textContent =
                inquiry.message || '';


            // 삭제 URL 설정
            document.getElementById('deleteForm').action =
                `/admin/inquiries/delete/${id}`;


            // 모달 열기
            document.getElementById('modal')
                .classList.add('open');

        } catch (error) {

            console.error(error);

            alert('문의 상세 정보를 불러오지 못했습니다.');

        }

    }

function getInquiryType(type) {

    switch (type) {

        case 1:
            return '협력';

        case 2:
            return '단체 수업 요청';

        case 3:
            return '질문';

        default:
            return '기타';

    }
}
    // 날짜 포맷
    function formatDateTime(value) {

        if (!value) {
            return '';
        }

        const date = new Date(value);

        if (isNaN(date.getTime())) {
            return value;
        }

        const year =
            date.getFullYear();

        const month =
            String(date.getMonth() + 1).padStart(2, '0');

        const day =
            String(date.getDate()).padStart(2, '0');

        const hours =
            String(date.getHours()).padStart(2, '0');

        const minutes =
            String(date.getMinutes()).padStart(2, '0');

        return `${year}-${month}-${day} ${hours}:${minutes}`;

    }


    // 모달 닫기
    function closeModal() {

        document.getElementById('modal')
            .classList.remove('open');

    }


    // 모달 배경 클릭 시 닫기
    document.getElementById('modal')
        .addEventListener('click', function(event) {

            if (event.target === this) {
                closeModal();
            }

        });


    // ESC 키로 닫기
    document.addEventListener('keydown', function(event) {

        if (event.key === 'Escape') {
            closeModal();
        }

    });

</script>
</body>
</html>
