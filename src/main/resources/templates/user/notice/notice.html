<!DOCTYPE html>

<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>공지 · 자료실 — B.POINT</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link
        href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Archivo+Black&display=swap"
        rel="stylesheet">

<link
        rel="stylesheet"
        th:href="@{/css/styles.css}"/>

<style>
    .page {
        padding: 80px 0 120px
    }

    .tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid var(--gray-200);
        margin: 60px 0 36px;
        flex-wrap: wrap
    }

    .tab {
        padding: 14px 24px;
        font-weight: 700;
        font-size: 15px;
        color: var(--gray-600);
        cursor: pointer;
        border-bottom: 3px solid transparent;
        margin-bottom: -1px;
        transition: all .15s ease;
        background: none;
        font-family: inherit;
        text-decoration: none;
    }

    .tab:hover {
        color: var(--ink)
    }

    .tab.active {
        color: var(--orange);
        border-bottom-color: var(--orange)
    }

    .tab .count {
        display: inline-block;
        background: var(--gray-100);
        color: var(--gray-600);
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        margin-left: 6px;
        font-weight: 700
    }

    .tab.active .count {
        background: var(--orange);
        color: #fff
    }

    .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 24px
    }

    .search {
        flex: 1;
        max-width: 360px;
        position: relative
    }

    .search input {
        width: 100%;
        padding: 12px 16px 12px 42px;
        border-radius: 999px;
        border: 1px solid var(--gray-200);
        background: #fff;
        font-family: inherit;
        font-size: 14px;
        outline: none;
        transition: border-color .15s ease;
        box-sizing: border-box;
    }

    .search input:focus {
        border-color: var(--orange)
    }

    .search::before {
        content: "⌕";
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--gray-400);
        font-size: 18px;
        pointer-events: none;
    }

    .sort {
        padding: 10px 16px;
        border: 1px solid var(--gray-200);
        border-radius: 999px;
        background: #fff;
        font-family: inherit;
        font-size: 14px;
        color: var(--gray-600);
        cursor: pointer
    }

    .notice-list {
        background: #fff;
        border: 1px solid var(--gray-200);
        border-radius: var(--radius);
        overflow: hidden
    }

    .notice-item {
        display: grid;
        grid-template-columns: 80px 1fr auto auto;
        align-items: center;
        gap: 20px;
        padding: 22px 26px;
        border-bottom: 1px solid var(--gray-100);
        cursor: pointer;
        transition: background .15s ease
    }

    .notice-item:last-child {
        border-bottom: 0
    }

    .notice-item:hover {
        background: #FAFAFA
    }

    .notice-badge {
        font-family: 'Archivo Black', sans-serif;
        font-size: 11px;
        letter-spacing: .15em;
        padding: 6px 12px;
        border-radius: 6px;
        background: var(--black);
        color: #fff;
        text-align: center;
        white-space: nowrap;
    }

    .notice-badge.new {
        background: var(--orange)
    }

    .notice-badge.data {
        background: var(--gray-800)
    }

    .notice-title {
        font-weight: 600;
        font-size: 15.5px;
        color: var(--ink);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .notice-meta {
        font-size: 13px;
        color: var(--gray-400);
        font-weight: 600;
        white-space: nowrap;
    }

    .notice-file {
        font-size: 12px;
        color: var(--orange);
        font-weight: 700;
        padding: 5px 10px;
        border: 1px solid var(--orange);
        border-radius: 999px;
        white-space: nowrap;
    }

    .notice-empty {
        padding: 80px 20px;
        text-align: center;
        color: var(--gray-400);
        font-size: 14px;
    }

    .pagination {
        display: flex;
        justify-content: center;
        gap: 6px;
        margin: 48px 0 0
    }

    .pagination a {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        border: 1px solid var(--gray-200);
        background: #fff;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        color: var(--gray-600);
        font-family: inherit;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
    }

    .pagination a:hover {
        background: #FAFAFA
    }

    .pagination a.active {
        background: var(--orange);
        color: #fff;
        border-color: var(--orange)
    }

    @media (max-width: 880px) {

        .notice-item {
            grid-template-columns: auto 1fr;
            gap: 10px;
            padding: 18px
        }

        .notice-title {
            grid-column: 2;
        }

        .notice-meta,
        .notice-file {
            grid-column: 2;
            font-size: 12px
        }
    }

    @media (max-width: 600px) {

        .page {
            padding: 50px 0 80px
        }

        .tabs {
            margin: 40px 0 24px
        }

        .tab {
            padding: 12px 16px
        }

        .toolbar {
            align-items: stretch
        }

        .search {
            max-width: none;
        }

        .sort {
            width: 100%;
        }

        .notice-item {
            grid-template-columns: auto 1fr;
        }

        .notice-title {
            font-size: 14px;
        }
    }
</style>

</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<!-- =========================
     PAGE HERO
========================= -->

<section class="page-hero">

<div class="container">

    <div class="breadcrumb">

        <a th:href="@{/}">
            홈
        </a>

        <span class="sep">
            /
        </span>

        공지 · 자료실

    </div>

    <span class="eyebrow">
        NOTICE &amp; RESOURCES
    </span>

    <h1>
        공지 ·
        <span class="o">
            자료실
        </span>
    </h1>

    <p class="lead">
        B.POINT의 클래스 모집, 협력 프로그램 안내,
        멘탈 트레이닝·기본 가이드 등 다양한 자료.
    </p>

</div>

</section>

<br>

<!-- =========================
     MAIN
========================= -->

<main class="page">

<div class="container">

    <!-- =========================
         TAB
    ========================= -->

    <div class="tabs">

        <!-- 전체 -->
        <a
                class="tab"
                th:classappend="${type == null ? ' active' : ''}"
                th:href="@{/notice(
                    keyword=${keyword},
                    sort=${sort}
                )}">

            전체

            <span
                    class="count"
                    th:text="${totalCount}">
                0
            </span>

        </a>


        <!-- 공지사항 -->
        <a
                class="tab"
                th:classappend="${type == 1 ? ' active' : ''}"
                th:href="@{/notice(
                    type=1,
                    keyword=${keyword},
                    sort=${sort}
                )}">

            공지사항

            <span
                    class="count"
                    th:text="${noticeCount}">
                0
            </span>

        </a>


        <!-- 자료실 -->
        <a
                class="tab"
                th:classappend="${type == 2 ? ' active' : ''}"
                th:href="@{/notice(
                    type=2,
                    keyword=${keyword},
                    sort=${sort}
                )}">

            자료실

            <span
                    class="count"
                    th:text="${dataCount}">
                0
            </span>

        </a>

    </div>


    <!-- =========================
         SEARCH / SORT
    ========================= -->

    <div class="toolbar">

        <!-- 검색 -->
        <form
                class="search"
                th:action="@{/notice}"
                method="get">

            <!-- 현재 탭 유지 -->
            <input
                    th:if="${type != null}"
                    type="hidden"
                    name="type"
                    th:value="${type}"/>

            <!-- 현재 정렬 유지 -->
            <input
                    type="hidden"
                    name="sort"
                    th:value="${sort}"/>

            <input
                    type="text"
                    name="keyword"
                    th:value="${keyword}"
                    placeholder="제목으로 검색하기"/>

        </form>


        <!-- 정렬 -->
        <select
                class="sort"
                onchange="location.href=this.value">

            <!-- 최신순 -->
            <option
                    th:value="@{/notice(
                        type=${type},
                        keyword=${keyword},
                        sort='createdAt,desc'
                    )}"
                    th:selected="${page.sort.getOrderFor('createdAt') == null
                        or page.sort.getOrderFor('createdAt').direction.name() == 'DESC'}">

                최신순

            </option>


            <!-- 오래된순 -->
            <option
                    th:value="@{/notice(
                        type=${type},
                        keyword=${keyword},
                        sort='createdAt,asc'
                    )}"
                    th:selected="${page.sort.getOrderFor('createdAt') != null
                        and page.sort.getOrderFor('createdAt').direction.name() == 'ASC'}">

                오래된순

            </option>

        </select>

    </div>


    <!-- =========================
         NOTICE LIST
    ========================= -->

    <div class="notice-list">

        <!-- ==========================================
             최신 공지사항
             전체 / 공지사항에서만 표시
             검색어가 있다면 제목이 검색어를 포함할 때 표시
        =========================================== -->

        <div
                class="notice-item notice-fixed"

                th:if="${latestNotice != null
                        and (type == null or type == 1)
                        and (keyword == null
                        or #strings.isEmpty(keyword)
                        or #strings.contains(
                            #strings.toLowerCase(latestNotice.title),
                            #strings.toLowerCase(keyword)
                        ))}"

                th:onclick="|location.href='@{/notice/{id}(id=${latestNotice.id})}'|">


            <!-- 최신 전체 글이면 NEW -->
            <span
                    class="notice-badge new"
                    th:if="${latestNotice.id == latestPostId}">

                NEW

            </span>


            <!-- 최신 공지이지만
                 더 최신인 자료실 글이 있는 경우 -->
            <span
                    class="notice-badge"
                    th:unless="${latestNotice.id == latestPostId}">

                공지

            </span>


            <!-- 제목 -->
            <span
                    class="notice-title"
                    th:text="${latestNotice.title}">

                공지 제목

            </span>


            <!-- 날짜 / 조회수 -->
            <span class="notice-meta">

                <span
                        th:text="${#temporals.format(
                            latestNotice.createdAt,
                            'yyyy.MM.dd'
                        )}">

                    2026.05.10

                </span>

                <span
                        th:if="${latestNotice.viewCount != null}">

                    · 조회

                    <span
                            th:text="${latestNotice.viewCount}">
                        0
                    </span>

                </span>

            </span>


            <!-- 공지는 자세히 -->
            <span class="notice-file">

                자세히 →

            </span>

        </div>


        <!-- ==========================================
             일반 게시글
             최신 공지는 Repository에서 이미 제외됨
        =========================================== -->

        <div
                class="notice-item"
                th:each="post : ${posts}"

                th:onclick="|location.href='@{/notice/{id}(id=${post.id})}'|">


            <!-- ==================================
                 NEW
                 전체 게시글 중 가장 최신 글
            =================================== -->

            <span
                    class="notice-badge new"
                    th:if="${post.id == latestPostId}">

                NEW

            </span>


            <!-- ==================================
                 일반 타입 뱃지
            =================================== -->

            <!-- 공지 -->
            <span
                    class="notice-badge"
                    th:if="${post.id != latestPostId and post.type == 1}">

                공지

            </span>


            <!-- 자료 -->
            <span
                    class="notice-badge data"
                    th:if="${post.id != latestPostId and post.type == 2}">

                자료

            </span>


            <!-- 제목 -->
            <span
                    class="notice-title"
                    th:text="${post.title}">

                게시글 제목

            </span>


            <!-- ==================================
                 날짜 / 조회수 / 파일 크기
            =================================== -->

            <span class="notice-meta">

                <!-- 날짜 -->
                <span
                        th:text="${#temporals.format(
                            post.createdAt,
                            'yyyy.MM.dd'
                        )}">

                    2026.05.10

                </span>


                <!-- 공지 조회수 -->
                <span
                        th:if="${post.type == 1
                                and post.viewCount != null}">

                    · 조회

                    <span
                            th:text="${post.viewCount}">
                        0
                    </span>

                </span>


                <!-- 자료실 파일 크기 -->
                <span
                        th:if="${post.type == 2
                                and post.fileName != null
                                and !#strings.isEmpty(post.fileName)}">

                    ·

                    <span
                            th:text="${post.fileSize != null
                                ? post.fileSize
                                : ''}">
                    </span>

                </span>

            </span>


            <!-- ==================================
                 오른쪽 표시
            =================================== -->

            <span class="notice-file">

                <!-- 공지사항 -->
                <th:block
                        th:if="${post.type == 1}">

                    자세히 →

                </th:block>


                <!-- 자료실 + 파일 없음 -->
                <th:block
                        th:if="${post.type == 2
                                and (post.fileName == null
                                or #strings.isEmpty(post.fileName))}">

                    자세히 →

                </th:block>


                <!-- 자료실 + 첨부파일 -->
                <th:block
                        th:if="${post.type == 2
                                and post.fileName != null
                                and !#strings.isEmpty(post.fileName)}">

                    <span
                            th:text="${#strings.toUpperCase(
                                #strings.substringAfterLast(
                                    post.fileName,
                                    '.'
                                )
                            ) + ' ↓'}">

                        PDF ↓

                    </span>

                </th:block>

            </span>

        </div>


        <!-- ==========================================
             게시글 없음
        =========================================== -->

        <div
                class="notice-empty"
                th:if="${posts.isEmpty()
                        and (latestNotice == null
                        or type == 2
                        or (keyword != null
                        and !#strings.isEmpty(keyword)
                        and !#strings.contains(
                            #strings.toLowerCase(latestNotice.title),
                            #strings.toLowerCase(keyword)
                        )))}">

            등록된 글이 없습니다.

        </div>

    </div>


    <!-- =========================
         PAGINATION
    ========================= -->

    <div
            class="pagination"
            th:if="${page.totalPages > 1}">


        <!-- 이전 페이지 -->
        <a
                th:if="${page.hasPrevious()}"
                th:href="@{/notice(
                    page=${page.number - 1},
                    type=${type},
                    keyword=${keyword},
                    sort=${sort}
                )}"
                aria-label="이전 페이지">

            ‹

        </a>


        <!-- 페이지 번호 -->
        <a
                th:each="i : ${#numbers.sequence(
                    0,
                    page.totalPages - 1
                )}"

                th:href="@{/notice(
                    page=${i},
                    type=${type},
                    keyword=${keyword},
                    sort=${sort}
                )}"

                th:text="${i + 1}"

                th:classappend="${i == page.number
                    ? ' active'
                    : ''}">

            1

        </a>


        <!-- 다음 페이지 -->
        <a
                th:if="${page.hasNext()}"
                th:href="@{/notice(
                    page=${page.number + 1},
                    type=${type},
                    keyword=${keyword},
                    sort=${sort}
                )}"
                aria-label="다음 페이지">

            ›

        </a>

    </div>

</div>

</main>

<br>

<!-- =========================
     FOOTER
========================= -->

<div th:replace="~{layout/footer :: footer}"></div>

<!-- =========================
     COMMON JS
========================= -->

<script th:src="@{/js/common.js}"></script>

</body>
</html>
